---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Greeter and session-menu configuration shared by both recipes.
modules:
  # Lightweight Wayland greeter.
  - type: dnf
    install:
      packages:
        - greetd
        - greetd-selinux

  - type: files
    files:
      - source: 04-greetd
        destination: /
      - source: 04-greetd
        destination: /

  # tuigreet 0.11.1 is source-only; build it in the image.
  - type: script
    snippets:
      - |
        set -euxo pipefail
        dnf install -y cargo rust gcc gcc-c++
        curl -fLsS --retry 5 \
          https://github.com/tuigreet/tuigreet/archive/refs/tags/0.11.1.tar.gz \
          -o /tmp/tuigreet.tar.gz
        tar -xzf /tmp/tuigreet.tar.gz -C /tmp
        cd /tmp/tuigreet-0.11.1
        cargo build --release --locked
        rm -f /usr/bin/tuigreet
        install -Dm755 target/release/tuigreet /usr/bin/tuigreet
        /usr/bin/tuigreet --version
        dnf remove -y cargo rust gcc gcc-c++ || true
        dnf clean all || true
        rm -rf /root/.cargo /tmp/tuigreet /tmp/tuigreet.tar.gz

  # The hyprland package ships a plain session; remove it, then install ours.
  - type: script
    snippets:
      - |
        set -euxo pipefail
        rm -f /usr/share/wayland-sessions/hyprland.desktop

  - type: files
    files:
      - source: 05-sessions
        destination: /
      - source: 05-sessions
        destination: /

  - type: files
    files:
      - source: 08-theming
        destination: /
      - source: 08-theming
        destination: /

  - type: systemd
    system:
      enabled:
        - greetd.service
