---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Build guards. Included at the end of both recipes.
modules:
  - type: script
    snippets:
      - |
        set -euxo pipefail

        # Custom binaries must live under /usr in atomic/bootc.
        test -x /usr/bin/tuigreet

        # Differentiate by the base image marker, not by the stack being checked.
        if grep -qiE 'bazzite-nvidia|nvidia' \
          /etc/os-release /usr/lib/os-release /usr/share/ublue-os/image-info.json 2>/dev/null; then
        fi
