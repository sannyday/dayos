---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# The image is published to ghcr.io/<GitHub user>/dayos
name: dayos
description: DayOS - Bazzite NVIDIA with Hyprland, labwc, Nix, Nerd Fonts, and personal system tweaks.

# Universal Blue Bazzite with the NVIDIA stack, stable channel.
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

# Modules run in order, top to bottom. Shared modules live in common.yml.
modules:
  - from-file: common.yml

  # Flatpaks are installed from Flathub by a systemd timer after boot, so they
  # are not stored in the image. This is the same "default apps" approach as
  # Bazzite; the list is enforced on every boot.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.brave.Browser
          - com.discordapp.Discord
          - com.github.PintaProject.Pinta
          - com.github.qarmin.czkawka
          - com.google.Chrome
          - com.nuclearplayer.Nuclear
          - com.ranfdev.DistroShelf
          - com.vivaldi.Vivaldi
          - com.vscodium.codium
          - io.freetubeapp.FreeTube
          - io.github.flattool.Warehouse
          - io.github.shiftey.Desktop
          - io.gitlab.librewolf-community
          - io.mpv.Mpv
          - md.obsidian.Obsidian
          - me.kozec.syncthingtk
          - net.ankiweb.Anki
          - net.mullvad.MullvadBrowser
          - org.cryptomator.Cryptomator
          - org.getmonero.Monero
          - org.gnome.meld
          - org.kde.gwenview
          - org.kde.kcalc
          - org.kde.kleopatra
          - org.kde.ktorrent
          - org.kde.okular
          - org.keepassxc.KeePassXC
          - org.libreoffice.LibreOffice
          - org.mozilla.firefox
          - org.torproject.torbrowser-launcher
          - org.videolan.VLC
          - org.wireshark.Wireshark
          - ru.yandex.Browser
          - us.zoom.Zoom


  # Installs the cosign policy files so signed image updates verify correctly.
  - type: signing
