---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# VM/test variant of DayOS.
name: dayos-vm
description: DayOS VM test variant on the non-NVIDIA Bazzite base.

# The regular DayOS image uses bazzite-nvidia, which cannot work in a VM
# without GPU passthrough. This variant uses the plain Bazzite base so the
# virtio GPU works.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: virtual/00-init
        destination: /
      - source: virtual/00-init
        destination: /

  - type: files
    files:
      - source: virtual/02-noscripts
        destination: /
      - source: virtual/02-noscripts
        destination: /

  - from-file: common.yml

  - from-file: greet.yml

  - type: files
    files:
      - source: virtual/04-greetd
        destination: /
      - source: virtual/04-greetd
        destination: /

  - type: files
    files:
      - source: virtual/05-sessions
        destination: /
      - source: virtual/05-sessions
        destination: /

  - type: files
    files:
      - source: virtual/06-vm
        destination: /
      - source: virtual/06-vm
        destination: /

  - type: files
    files:
      - source: virtual/08-theming
        destination: /
      - source: virtual/08-theming
        destination: /

  # Enable the VM test-user service after its unit is copied.
  - type: systemd
    system:
      enabled:
        - dayos-vm-user.service
